name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: ${{ matrix.os }} ${{ matrix.toolchain.compiler }} ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    # Windows is not officially supported yet: run it, but do not fail the workflow
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain:
          - {compiler: gcc, version: 13}
          - {compiler: intel, version: '2025.0'}
        profile: [debug, release]
        experimental: [false]
        include:
          - {os: windows-latest, toolchain: {compiler: gcc, version: 13}, profile: debug, experimental: true}
          - {os: windows-latest, toolchain: {compiler: gcc, version: 13}, profile: release, experimental: true}
    defaults:
      run:
        shell: bash
    env:
      FPM_OPTS: --profile ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      # official fpm binaries; the PyPI fpm.exe fails to start on Windows (missing DLLs)
      - uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fpm-version: '0.13.0'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Build
        run: fpm build $FPM_OPTS --compiler ${{ env.FC }} --c-compiler ${{ env.CC }} --cxx-compiler ${{ env.CXX }}

      - name: Regression test
        run: |
          exe=$(fpm run run2LDRM $FPM_OPTS --compiler ${{ env.FC }} --c-compiler ${{ env.CC }} --cxx-compiler ${{ env.CXX }} --runner echo | tail -1)
          python -m pytest test/regression -v --exe "$exe"
