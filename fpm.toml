name = "run2LDRM"
version = "0.1.0"
license = "license"
author = "Jane Doe"
maintainer = "jane.doe@example.com"
copyright = "Copyright 2024, Jane Doe"
[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
[install]
library = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[preprocess]
[preprocess.cpp]
macros = ["_OPENMP"]
[dependencies]
FLAP = { git="https://github.com/szaghi/FLAP.git", rev="19cad029681176ce9ae35296e99c5cf42da0212e" }  # needs set_config (INI files)
toml-f = { git="https://github.com/toml-f/toml-f.git", tag="v0.5.2" }
# stdlib-fpm branch of fortran-lang/stdlib (only stdlib_datetime is used)
stdlib = { git="https://github.com/fortran-lang/stdlib", rev="58eb9133966c2797e0593281169ef57c43eccc1d" }
csv-fortran = { git="https://github.com/jacobwilliams/csv-fortran.git" }
openmp = "*"

